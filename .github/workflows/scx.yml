name: Build scx_lavd for Android (aarch64, static)
on:
  workflow_dispatch:
    inputs:
      scx_ref:
        description: 'sched-ext/scx tag'
        default: 'v1.0.20'
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libelf-dev zlib1g-dev libzstd-dev libseccomp-dev pkg-config protobuf-compiler build-essential git
          rustup toolchain install stable --profile minimal
          python3 -m pip install --break-system-packages ziglang
          mkdir -p $HOME/musl-bin
          printf '#!/bin/sh\nexec python3 -m ziglang cc -target aarch64-linux-musl \"$(echo \"$@\" | sed \"s/aarch64-unknown-linux-musl/aarch64-linux-musl/g\")\"\n' > $HOME/musl-bin/aarch64-linux-musl-gcc
          printf '#!/bin/sh\nexec python3 -m ziglang ar "$@"\n' > $HOME/musl-bin/aarch64-linux-musl-ar
          chmod +x $HOME/musl-bin/*
          echo "$HOME/musl-bin" >> $GITHUB_PATH
      - run: git clone --depth 1 --branch "${{ inputs.scx_ref }}" https://github.com/sched-ext/scx.git
      - run: |
          cd scx
          rustup target add aarch64-unknown-linux-musl; CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc CC_aarch64-unknown-linux-musl=aarch64-linux-musl-gcc AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar RUSTFLAGS="-C target-feature=+crt-static" cargo +stable build --release --target aarch64-unknown-linux-musl -p scx_lavd
      - run: |
          mkdir out
          cp scx/target/aarch64-unknown-linux-musl/release/scx_lavd out/
          file out/scx_lavd
          sha256sum out/scx_lavd
      - uses: actions/upload-artifact@v4
        with:
          name: scx_lavd-aarch64
          path: out/
