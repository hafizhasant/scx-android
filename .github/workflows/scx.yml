name: Build scx_lavd (Alpine musl, static)
on:
  workflow_dispatch:
    inputs:
      scx_ref:
        description: 'sched-ext/scx tag'
        default: 'v1.0.20'
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone scx
        run: git clone --depth 1 --branch "${{ inputs.scx_ref }}" https://github.com/sched-ext/scx.git
      - name: Build inside Alpine (native arm64 musl, static)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/scx:/w" -w /w -e RUSTFLAGS="-C target-feature=+crt-static" -e LIBCLANG_PATH=/usr/lib rust:alpine sh -c 'apk add --no-cache build-base clang-dev elfutils-dev zlib-dev zlib-static zstd-dev zstd-static linux-headers pkgconf protobuf-dev protoc && cargo build --release -p scx_lavd'
      - name: Collect binary
        run: |
          mkdir out
          cp scx/target/release/scx_lavd out/
          file out/scx_lavd || true
      - uses: actions/upload-artifact@v4
        with:
          name: scx_lavd-aarch64
          path: out/
